<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle Log</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#dde3ea;--pr:#1f6feb;--ok:#1a9d55;--wa:#d9822b;--lo:#7a3fd1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mu:#93a0b1;--bd:#2c3644;--pr:#4c8dff;--ok:#38c776;--wa:#f0a050;--lo:#a77bf0}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mu:#93a0b1;--bd:#2c3644;--pr:#4c8dff;--ok:#38c776;--wa:#f0a050;--lo:#a77bf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
.st b{display:block;font-size:20px}.st span{font-size:12px;color:var(--mu)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:7px 10px}
button.d{background:none;color:#d33;padding:7px 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar select,.bar input{width:auto;flex:1;min-width:120px}
.trip{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.veh{font-size:17px;font-weight:700}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;margin-left:6px}
.tag.Local{background:var(--lo)}.tag.Outstation{background:var(--wa)}
.tag.out{background:var(--wa)}.tag.in{background:var(--ok)}
.call{display:inline-block;background:var(--ok);color:#fff;text-decoration:none;padding:6px 12px;border-radius:8px;font-weight:600}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-top:10px;font-size:13px}
.row span{color:var(--mu);display:block;font-size:11px}
.act{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;color:var(--mu);padding:24px}
#m,#dm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#m .box,#dm .box{width:100%;max-width:360px;margin:0}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th,.tb td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}.tb th{color:var(--mu);font-weight:600}.tb a{color:var(--pr)}.sc{overflow-x:auto}
summary{font-weight:700;cursor:pointer}
.hl{margin-top:10px;padding:9px 12px;border-left:5px solid var(--pr);background:rgba(76,141,255,.14);border-radius:8px;font-size:14px;display:grid;gap:2px}
.hl span{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tmr{display:inline-block;font-variant-numeric:tabular-nums;font-weight:700;background:rgba(217,130,43,.16);color:var(--wa);padding:5px 12px;border-radius:8px;font-size:15px}.tmr.fin{background:rgba(26,157,85,.16);color:var(--ok)}
</style>
</head>
<body>
<div class="w" id="app" style="display:none">
<div class="top"><h1 style="margin:4px 0 12px">🚗 Vehicle In/Out Log</h1><button class="s" onclick="logout()">Logout (MTO)</button></div>
<div class="stats">
<div class="st"><b id="s1">0</b><span>Total trips</span></div>
<div class="st"><b id="s2">0</b><span>Inside now</span></div>
<div class="st"><b id="s3">0</b><span>Local</span></div>
<div class="st"><b id="s4">0</b><span>Outstation</span></div>
<div class="st"><b id="s5">0</b><span>Total km</span></div>
</div>

<details class="box" id="sum">
<summary>📊 Daily Run Summary</summary>
<div class="bar" style="margin-top:10px"><input id="sd" type="date" onchange="renderSum()"><button class="s" onclick="shiftDay(-1)">◀ Prev</button><button class="s" onclick="shiftDay(1)">Next ▶</button><button class="s" onclick="copySum()">Copy summary</button></div>
<div class="bar"><button class="s" onclick="expDay('pdf')">⬇ PDF</button><button class="s" onclick="expDay('xlsx')">⬇ Excel</button><button class="s" onclick="expDay('csv')">⬇ CSV</button><button class="s" onclick="expAll()">⬇ All days (Excel)</button></div>
<div id="sumout"></div>
</details>

<div class="box">
<div class="g">
<div><label>Vehicle number</label><input id="vn" placeholder="e.g. MH12AB1234" autocapitalize="characters"></div>
<div><label>Driver name</label><input id="dn" placeholder="Driver name"></div>
<div><label>Driver number</label><input id="dp" type="tel" inputmode="tel" placeholder="Phone number"></div>
<div><label>Trip type</label><select id="ty"><option>Local</option><option>Outstation</option></select></div>
<div><label>Vehicle model</label><input id="vm" placeholder="e.g. Toyota Innova"></div>
<div><label>Assigned purpose / assigned to</label><input id="vp" placeholder="e.g. Site visit - Mr. Sharma"></div>
<div><label>Destination / details</label><input id="de" placeholder="Place to visit"></div>
<div><label>In time (arrival)</label><input id="ti" type="datetime-local"></div>
<div><label>In km</label><input id="tk" type="number" inputmode="decimal" min="0" placeholder="Odometer"></div>
</div>
<div class="act"><button onclick="addTrip()">+ Vehicle In</button></div>
</div>

<div class="bar">
<input id="q" placeholder="Search vehicle / driver" oninput="render()">
<select id="ft" onchange="render()"><option value="">All types</option><option>Local</option><option>Outstation</option></select>
<select id="fs" onchange="render()"><option value="">All status</option><option value="in">Inside</option><option value="out">Left</option></select>
</div>
<div id="list"></div>
</div>

<div id="cb" class="box" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;margin:0;box-shadow:0 4px 20px rgba(0,0,0,.3)"><div>Couldn't open the dialer from this view. Number: <b id="cn"></b></div><div class="act"><button onclick="copyNum()">Copy number</button><button class="s" onclick="$('cb').style.display='none'">Close</button></div></div>
<div id="lg" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px"><div class="box" style="width:100%;max-width:340px;margin:0"><h1 style="margin:0 0 12px">🚗 Vehicle Log Login</h1><label>User ID</label><input id="lu" autocapitalize="characters" autocomplete="username" placeholder="User ID"><div style="margin-top:10px"><label>Password</label><input id="lp" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"></div><div id="le" style="color:#d33;font-size:13px;margin-top:8px;min-height:18px"></div><div class="act"><button onclick="doLogin()" style="width:100%">Login</button></div></div></div>
<div id="dm"><div class="box"><b>Delete this entry?</b><div id="dt" style="margin-top:8px;color:var(--mu)"></div><div style="margin-top:6px;font-size:13px">The vehicle, driver details and times will be removed permanently.</div><div class="act"><button style="background:#d33" onclick="delYes()">Yes, delete</button><button class="s" onclick="closeD()">Cancel</button></div></div></div>
<div id="m"><div class="box">
<b id="mt">Vehicle Out</b>
<div style="margin-top:10px"><label>Out time</label><input id="mo" type="datetime-local"></div>
<div style="margin-top:10px"><label>Out km</label><input id="mk" type="number" inputmode="decimal" min="0"></div>
<div class="act"><button onclick="saveOut()">Save</button><button class="s" onclick="closeM()">Cancel</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
var KEY="vehicleLogV2",trips=[],cur=null;
window.alert=function(m){var e=$("tt");if(!e){e=document.createElement("div");e.id="tt";e.style.cssText="position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:99;color:#fff;padding:12px 14px;border-radius:10px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.3)";document.body.appendChild(e)}e.style.background=/cannot|enter|please|could not|not |did not|no entries/i.test(m)?"#d33":"#1a9d55";e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(function(){e.style.display="none"},4500)};
try{trips=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){trips=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(trips))}catch(e){}}
function nowStr(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(s){if(!s)return"-";var d=new Date(s);return d.toLocaleString([], {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}
function dur(a,b){if(!a||!b)return"-";var m=Math.round((new Date(b)-new Date(a))/60000);if(m<0)return"-";var d=Math.floor(m/1440),h=Math.floor(m%1440/60);m=m%60;return(d?d+"d ":"")+h+"h "+m+"m"}
function addTrip(){
var v=$("vn").value.trim().toUpperCase(),n=$("dn").value.trim(),p=$("dp").value.trim(),k=parseFloat($("tk").value);
if(!v||!n||!p||isNaN(k)||!$("ti").value){alert("Please fill vehicle, driver name, driver number, in time and in km.");return}
trips.unshift({id:Date.now(),v:v,n:n,p:p,ty:$("ty").value,de:$("de").value.trim(),vm:$("vm").value.trim(),vp:$("vp").value.trim(),it:$("ti").value,ik:k,ot:"",ok:null});
save();["vn","dn","dp","de","vm","vp","tk"].forEach(function(i){$(i).value=""});$("ti").value=nowStr();render()}
function openOut(id){cur=id;$("mo").value=nowStr();$("mk").value="";$("m").style.display="flex"}
function closeM(){$("m").style.display="none";cur=null}
function saveOut(){
var t=trips.find(function(x){return x.id===cur}),k=parseFloat($("mk").value);
if(!t||isNaN(k)||!$("mo").value){alert("Enter out time and out km.");return}
if(k<t.ik){alert("Out km cannot be less than in km ("+t.ik+").");return}
if(new Date($("mo").value)<new Date(t.it)){alert("Out time cannot be before in time.");return}
t.ot=$("mo").value;t.ok=k;save();closeM();render()}
var sumText="";
function hm(m){return(m>=1440?Math.floor(m/1440)+"d ":"")+Math.floor(m%1440/60)+"h "+m%60+"m"}
function tm(s){return s?new Date(s).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"-"}
function shiftDay(n){var d=new Date($("sd").value+"T00:00");d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());$("sd").value=d.toISOString().slice(0,10);renderSum()}
function renderSum(){
var d=$("sd").value;if(!d){$("sumout").innerHTML="";return}
var ts=trips.filter(function(t){return t.it.slice(0,10)===d}).sort(function(a,b){return a.v<b.v?-1:a.v>b.v?1:a.it<b.it?-1:1});
var km=0,mins=0,lo=0,os=0,ins=0,vs={},rows="";
ts.forEach(function(t){vs[t.v]=1;if(t.ty==="Local")lo++;else os++;if(t.ot){km+=t.ok-t.ik;mins+=Math.max(0,Math.round((new Date(t.ot)-new Date(t.it))/60000))}else ins++;
rows+='<tr><td><b>'+esc(t.v)+'</b></td><td>'+esc(t.vm||"-")+'</td><td>'+esc(t.vp||"-")+'</td><td><a href="tel:'+esc(t.p.replace(/[^\d+]/g,""))+'" data-n="'+esc(t.p.replace(/[^\d+]/g,""))+'" onclick="callDrv(this)" target="_blank" rel="noopener">📞 '+esc(t.n)+' · '+esc(t.p)+'</a></td><td>'+t.ty+'</td><td>'+tm(t.it)+'</td><td>'+(t.ot?tm(t.ot):"Inside")+'</td><td>'+(t.ot?+(t.ok-t.ik).toFixed(1):"-")+'</td><td>'+dur(t.it,t.ot)+'</td></tr>'});
var nv=Object.keys(vs).length;km=+km.toFixed(1);
var label=new Date(d+"T00:00").toLocaleDateString([],{day:"2-digit",month:"short",year:"numeric"});
sumText="Daily Run Summary - "+label+"\nVehicles: "+nv+" | Trips: "+ts.length+" (Local "+lo+", Outstation "+os+")\nStill inside: "+ins+"\nTotal km: "+km+"\nTotal time: "+hm(mins)+"\n\n"+ts.map(function(t){return t.v+(t.vm?" ("+t.vm+")":"")+(t.vp?" ["+t.vp+"]":"")+" - "+t.n+" ("+t.p+") - "+t.ty+" - In "+tm(t.it)+" - Out "+tm(t.ot)+" - "+(t.ot?+(t.ok-t.ik).toFixed(1)+" km - "+dur(t.it,t.ot):"inside")}).join("\n");
$("sumout").innerHTML='<div class="stats"><div class="st"><b>'+nv+'</b><span>Vehicles</span></div><div class="st"><b>'+ts.length+'</b><span>Trips</span></div><div class="st"><b>'+lo+' / '+os+'</b><span>Local / Outstation</span></div><div class="st"><b>'+km+'</b><span>Total km</span></div><div class="st"><b>'+hm(mins)+'</b><span>Total time</span></div></div>'+(ts.length?'<div class="sc"><table class="tb"><tr><th>Vehicle</th><th>Model</th><th>Purpose</th><th>Driver</th><th>Type</th><th>In</th><th>Out</th><th>KM</th><th>Time</th></tr>'+rows+'<tr><th>Total</th><th></th><th></th><th></th><th></th><th></th><th></th><th>'+km+'</th><th>'+hm(mins)+'</th></tr></table></div>':'<div class="empty">No vehicles came in on this date.</div>')}
function copySum(){
function fb(){var a=document.createElement("textarea");a.value=sumText;document.body.appendChild(a);a.select();try{document.execCommand("copy");alert("Summary copied")}catch(e){alert("Copy not supported on this device")}a.remove()}
try{navigator.clipboard.writeText(sumText).then(function(){alert("Summary copied")},fb)}catch(e){fb()}}
function callDrv(a){var n=a.getAttribute("data-n"),h=false;function vh(){if(document.hidden)h=true}document.addEventListener("visibilitychange",vh);setTimeout(function(){document.removeEventListener("visibilitychange",vh);if(!h){$("cn").textContent=n;$("cb").style.display="block"}},1500)}
function copyNum(){var n=$("cn").textContent;try{navigator.clipboard.writeText(n).then(function(){alert("Number copied")},function(){alert(n)})}catch(e){alert(n)}}
var H=["Date","Vehicle","Model","Purpose","Driver","Driver No.","Type","Destination","In Time","In KM","Out Time","Out KM","KM Run","Total Time"];
function dayTrips(d){return trips.filter(function(t){return t.it.slice(0,10)===d}).sort(function(a,b){return a.v<b.v?-1:a.v>b.v?1:a.it<b.it?-1:1})}
function exRow(t){var o=!!t.ot;return[t.it.slice(0,10),t.v,t.vm||"",t.vp||"",t.n,t.p,t.ty,t.de||"",t.it.replace("T"," "),t.ik,o?t.ot.replace("T"," "):"",o?t.ok:"",o?+(t.ok-t.ik).toFixed(1):"",o?dur(t.it,t.ot):"Inside"]}
function dayTot(ts){var km=0,m=0;ts.forEach(function(t){if(t.ot){km+=t.ok-t.ik;m+=Math.max(0,Math.round((new Date(t.ot)-new Date(t.it))/60000))}});return{km:+km.toFixed(1),m:m}}
function totRow(ts){var s=dayTot(ts);return["TOTAL","","","","","","","","","","","",s.km,hm(s.m)]}
function saveFile(name,data){
if(!(window.claude&&claude.use)){try{var b=new Blob([data]),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){alert("Could not save file")}return}
claude.use("downloads").then(function(dl){if(!dl){alert("Export is not available in this view. Open the page link in your phone browser.");return}
return dl.save({filename:name,data:data})}).catch(function(e){if(!e||e.code!=="declined")alert("Could not save file: "+(e&&e.message?e.message:e))})}
function expDay(kind){
var d=$("sd").value,ts=dayTrips(d);
if(!d||!ts.length){alert("No entries for this date.");return}
var rows=ts.map(exRow).concat([totRow(ts)]),name="vehicle-log-"+d;
if(kind==="csv"){saveFile(name+".csv","\ufeff"+[H].concat(rows).map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\r\n"));return}
if(kind==="xlsx"){if(!window.XLSX){alert("Excel library did not load.");return}
var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([H].concat(rows)),d);
saveFile(name+".xlsx",new Uint8Array(XLSX.write(wb,{bookType:"xlsx",type:"array"})));return}
if(!window.jspdf){alert("PDF library did not load.");return}
var s=dayTot(ts),doc=new jspdf.jsPDF({orientation:"landscape"});
doc.setFontSize(14);doc.text("Daily Vehicle Run Summary - "+d,14,14);
doc.setFontSize(10);doc.text("Trips: "+ts.length+"   Total km: "+s.km+"   Total time: "+hm(s.m),14,21);
doc.autoTable({startY:26,styles:{fontSize:8},head:[["Vehicle","Model","Purpose","Driver","Type","In","Out","KM","Time"]],
body:ts.map(function(t){return[t.v,t.vm||"-",t.vp||"-",t.n+" "+t.p,t.ty,tm(t.it),t.ot?tm(t.ot):"Inside",t.ot?+(t.ok-t.ik).toFixed(1):"-",dur(t.it,t.ot)]}),
foot:[["Total","","","","","","",s.km,hm(s.m)]]});
saveFile(name+".pdf",doc.output("arraybuffer"))}
function expAll(){
if(!trips.length){alert("No entries yet.");return}
if(!window.XLSX){alert("Excel library did not load.");return}
var ds=[],wb=XLSX.utils.book_new();trips.forEach(function(t){var k=t.it.slice(0,10);if(ds.indexOf(k)<0)ds.push(k)});ds.sort();
var ov=[["Date","Vehicles","Trips","Local","Outstation","Total KM","Total Time"]];
ds.forEach(function(k){var ts=dayTrips(k),s=dayTot(ts),vs={};ts.forEach(function(t){vs[t.v]=1});
ov.push([k,Object.keys(vs).length,ts.length,ts.filter(function(t){return t.ty==="Local"}).length,ts.filter(function(t){return t.ty==="Outstation"}).length,s.km,hm(s.m)])});
XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ov),"Overview");
ds.forEach(function(k){var ts=dayTrips(k);XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([H].concat(ts.map(exRow),[totRow(ts)])),k)});
saveFile("vehicle-log-all-days.xlsx",new Uint8Array(XLSX.write(wb,{bookType:"xlsx",type:"array"})))}
var dcur=null;
function show(ok){$("lg").style.display=ok?"none":"flex";$("app").style.display=ok?"block":"none"}
function chkAuth(){var ok=false;try{ok=localStorage.getItem("vlAuth")==="1"}catch(e){}show(ok)}
function doLogin(){var u=$("lu").value.trim(),p=$("lp").value;if(u.toUpperCase()==="MTO"&&p==="Admin"){try{localStorage.setItem("vlAuth","1")}catch(e){}$("lp").value="";$("le").textContent="";show(true)}else{$("le").textContent="Wrong user ID or password"}}
function logout(){try{localStorage.removeItem("vlAuth")}catch(e){}$("lu").value="";show(false)}
function p2(x){return(x<10?"0":"")+x}
function tick(){var n=Date.now();document.querySelectorAll(".tmr:not(.fin)").forEach(function(e){var s=Math.max(0,Math.floor((n-new Date(e.getAttribute("data-it")))/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);e.textContent="\u23f1 Inside "+(d?d+"d ":"")+p2(h)+":"+p2(m)+":"+p2(s%60)})}
setInterval(tick,1000);
function del(id){var t=trips.find(function(x){return x.id===id});if(!t)return;dcur=id;$("dt").textContent=t.v+" - "+t.n+" ("+t.p+")";$("dm").style.display="flex"}
function closeD(){$("dm").style.display="none";dcur=null}
function delYes(){trips=trips.filter(function(x){return x.id!==dcur});save();closeD();render()}
function render(){
renderSum();setTimeout(tick,0);
var q=$("q").value.toLowerCase(),ft=$("ft").value,fs=$("fs").value;
var rows=trips.filter(function(t){
if(ft&&t.ty!==ft)return false;
if(fs==="in"&&t.ot)return false;
if(fs==="out"&&!t.ot)return false;
return!q||(t.v+" "+t.n+" "+t.p+" "+t.de).toLowerCase().indexOf(q)>-1});
$("s1").textContent=trips.length;
$("s2").textContent=trips.filter(function(t){return!t.ot}).length;
$("s3").textContent=trips.filter(function(t){return t.ty==="Local"}).length;
$("s4").textContent=trips.filter(function(t){return t.ty==="Outstation"}).length;
$("s5").textContent=trips.reduce(function(a,t){return a+(t.ot?t.ok-t.ik:0)},0).toFixed(1).replace(/\.0$/,"");
if(!rows.length){$("list").innerHTML='<div class="empty">No entries yet. Add a vehicle in above.</div>';return}
$("list").innerHTML=rows.map(function(t){
var done=!!t.ot,tel=t.p.replace(/[^\d+]/g,"");
return '<div class="trip"><div class="top"><div><span class="veh">'+esc(t.v)+'</span><span class="tag '+t.ty+'">'+t.ty+'</span><span class="tag '+(done?"out":"in")+'">'+(done?"Left":"Inside")+'</span></div>'+
'<a class="call" href="tel:'+esc(tel)+'" data-n="'+esc(tel)+'" onclick="callDrv(this)" target="_blank" rel="noopener">📞 '+esc(t.n)+' · '+esc(t.p)+'</a></div>'+
'<div style="margin-top:8px"><span class="tmr'+(done?' fin':'')+'" data-it="'+t.it+'">'+(done?'\u23f1 Total '+dur(t.it,t.ot):'')+'</span></div>'+
(t.vm||t.vp?'<div class="hl"><div><span>Vehicle model</span><b>'+esc(t.vm||"-")+'</b></div><div><span>Assigned purpose</span><b>'+esc(t.vp||"-")+'</b></div></div>':'')+
(t.de?'<div style="margin-top:6px;color:var(--mu)">'+esc(t.de)+'</div>':'')+
'<div class="row"><div><span>In time</span>'+fmt(t.it)+'</div><div><span>Out time</span>'+fmt(t.ot)+'</div>'+
'<div><span>In km</span>'+t.ik+'</div><div><span>Out km</span>'+(done?t.ok:"-")+'</div>'+
'<div><span>Total time</span><b>'+dur(t.it,t.ot)+'</b></div><div><span>Total km</span><b>'+(done?+(t.ok-t.ik).toFixed(1):"-")+'</b></div></div>'+
'<div class="act">'+(done?'':'<button onclick="openOut('+t.id+')">Vehicle Out</button>')+'<button class="d" onclick="del('+t.id+')">Delete</button></div></div>'}).join("")}
$("ti").value=nowStr();$("sd").value=nowStr().slice(0,10);render();chkAuth();
</script>
</body>
</html>
